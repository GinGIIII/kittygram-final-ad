server {
    listen 80;
    server_tokens off;
    client_max_body_size 10M;

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/admin/;
    }

    location /media/ {
        alias /staticfiles/media/;
    }

    location / {
        alias /staticfiles/;
        index index.html;
        try_files $uri /index.html;
    }
}
